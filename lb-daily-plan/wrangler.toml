# Cloudflare Pages settings for the LB & Sons Daily Plan app.
# Most people can deploy from the dashboard (see README) and never touch this file.
# It's here for anyone who prefers the command line (`npx wrangler pages deploy public`).

name = "lb-daily-plan"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

# The shared "notebook". After you create a KV namespace named PLAN_KV in the
# Cloudflare dashboard, paste its ID below (or bind it in the dashboard UI).
[[kv_namespaces]]
binding = "PLAN_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
